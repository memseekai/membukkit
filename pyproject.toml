[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membukkit"
description = "MemBukkit: explainable long-term memory for LLMs — bucketed, provenance-tracked, scan-budgeted retrieval for agents and RAG."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MemBukkit contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
keywords = [
    "conversational-memory",
    "information-retrieval",
    "long-term-memory",
    "rag",
    "retrieval",
    "explainability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "torch>=2.1.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "openai>=1.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20.0"]
google = ["google-genai>=1.0.0"]
pdf = ["pypdf>=4.0.0"]
turbopuffer = ["turbopuffer>=0.5.0"]
agent = ["pydantic-ai>=2.0.0,<3"]
observability = ["logfire[fastapi,httpx,system-metrics]>=3.0"]
docs = ["mkdocs-material>=9.5"]
mcp = ["mcp>=1.2.0"]
bm25 = ["rank-bm25>=0.2.2"]
service = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]
all = [
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "pypdf>=4.0.0",
    "turbopuffer>=0.5.0",
    "pydantic-ai>=2.0.0,<3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "mcp>=1.2.0",
    "rank-bm25>=0.2.2",
]
dev = [
    "build>=1.2.2",
    "check-wheel-contents>=0.6.1",
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "twine>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/MemseekAI/membukkit"
Repository = "https://github.com/MemseekAI/membukkit"
Issues = "https://github.com/MemseekAI/membukkit/issues"
Documentation = "https://github.com/MemseekAI/membukkit#readme"

[project.scripts]
membukkit = "membukkit.cli:main"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "check-wheel-contents>=0.6.1",
    "pytest>=7.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
    "twine>=5.1.1",
]

[tool.setuptools.dynamic]
version = { attr = "membukkit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["membukkit", "membukkit.*"]

[tool.setuptools.package-data]
membukkit = ["py.typed", "ui_dist/**/*", "demos/**/*", "prompts/packs/*.yaml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "notebooks", "demos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
